name: Build and Publish Docker Images

# Builds the Music Assistant + ytmusic_free provider image. Official
# releases and automatic (untested) builds use strictly separated tags:
#
# Official releases (tag-push `v*` / `X.Y.Z*`, considered TESTED):
#   :<version>  (git tag without the `v` prefix, e.g. :2.1.0)
#   :latest     (moving tag, the tested recommendation)
#   Base image: ghcr.io/music-assistant/server:latest, MA_VERSION=latest,
#   provider code from the build context (the tagged commit).
#
# Automatic builds (schedule / push to main / manual dispatch, UNTESTED):
#   :edge    -> base image ghcr.io/music-assistant/server:latest  (stable 2.X releases)
#   :beta    -> base image ghcr.io/music-assistant/server:beta    (2.X.0b*/rc pre-releases)
#   :nightly -> base image ghcr.io/music-assistant/server:nightly (2.X.0.dev* builds)
#   Each also gets an immutable rollback companion tag
#   `:<tag>-YYYYMMDD-<shortsha>` (e.g. :edge-20260831-a1b2c3d).
#
# The tag separation exists because a change in the upstream base image can
# break the plugin at any time; only official tag-push releases are tested.
#
# Plugin code source per leg:
#   - The `edge` leg and release builds always use the provider code from
#     the build context (the checked-out commit of this repository).
#   - The `beta`/`nightly` legs default to the `main` branch of the plugin
#     repo, but can be switched to a different git ref (e.g. a `dev` or
#     `beta` branch, useful when the MA provider interface changes) via the
#     `plugin_ref` workflow_dispatch input. The Dockerfile then downloads
#     the provider from that ref instead of using the build context.
#
# Digest change detection:
#   For each variant the current digest of the moving base-image tag is
#   compared against the annotations stamped on the previously published
#   image (`org.opencontainers.image.base.digest` and
#   `org.opencontainers.image.revision`). Both must match to skip the build;
#   this also re-builds variants whose previous push build failed (the
#   revision annotation still points at the older commit). Release builds
#   skip this check entirely. The decision logic lives in
#   .github/scripts/evaluate_build_matrix.sh.

on:
  schedule:
    # Daily at 06:23 AM UTC (offset from the full hour, consistent with the
    # other workflows) to catch new base image updates.
    - cron: '23 6 * * *'
  push:
    branches: [ "main" ]
    paths:
      - 'ytmusic_free/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-publish.yml'
      - '.github/scripts/evaluate_build_matrix.sh'
  # Version tag pushes are handled by release.yml, which calls this workflow
  # via `workflow_call` (a tag push has no path diff, so a `paths:`-filtered
  # `tags:` entry under `push:` above would never run).
  workflow_call:
    inputs:
      release_tag:
        description: >-
          Version tag being released, e.g. v1.0.0. Set only by release.yml.
          Empty on push/schedule/dispatch runs, which publish channel tags only.
        type: string
        required: false
        default: ""
  pull_request:
    paths:
      - 'ytmusic_free/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-publish.yml'
      - '.github/scripts/evaluate_build_matrix.sh'
  workflow_dispatch:
    # Manual trigger. Restricted to the main branch via a ref guard in the
    # check job. By default a manual run behaves like the scheduled run
    # (skips variants whose base digest and revision are unchanged); set
    # force_build=true to always build all variants.
    inputs:
      force_build:
        description: 'Force build even if base digest and revision are unchanged'
        type: boolean
        required: false
        default: false
      plugin_ref:
        description: 'Plugin git ref for the beta/nightly legs (default: main)'
        type: string
        required: false
        default: 'main'

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BASE_IMAGE_LATEST: ghcr.io/music-assistant/server:latest
  BASE_IMAGE_BETA: ghcr.io/music-assistant/server:beta
  BASE_IMAGE_DEV: ghcr.io/music-assistant/server:nightly
  ANNOTATION_BASE_DIGEST: org.opencontainers.image.base.digest
  ANNOTATION_REVISION: org.opencontainers.image.revision

jobs:
  check:
    name: Decide which variants to build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.decision.outputs.matrix }}
      has_builds: ${{ steps.decision.outputs.has_builds }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Collect base digests and decide builds
        id: decision
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          GIT_REF: ${{ github.ref }}
          GIT_REF_TYPE: ${{ github.ref_type }}
          PR_BASE_BRANCH: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          FORCE_BUILD: ${{ inputs.force_build || 'false' }}
          PLUGIN_REF_INPUT: ${{ inputs.plugin_ref || 'main' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REGISTRY: ${{ env.REGISTRY }}
          BASE_IMAGE_LATEST: ${{ env.BASE_IMAGE_LATEST }}
          BASE_IMAGE_BETA: ${{ env.BASE_IMAGE_BETA }}
          BASE_IMAGE_DEV: ${{ env.BASE_IMAGE_DEV }}
          ANNOTATION_BASE_DIGEST: ${{ env.ANNOTATION_BASE_DIGEST }}
          ANNOTATION_REVISION: ${{ env.ANNOTATION_REVISION }}
        run: bash .github/scripts/evaluate_build_matrix.sh

  build:
    name: Build ${{ matrix.variant }} image
    needs: check
    if: needs.check.outputs.has_builds == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: ${{ fromJson(needs.check.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to the Container registry
        if: matrix.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Materialise the input as an env var so the tag expressions below compare
      # a real string. On push/schedule/dispatch runs `inputs` is empty and this
      # writes RELEASE_TAG= (empty), with no reliance on how GitHub coerces null.
      - name: Resolve release tag
        run: echo "RELEASE_TAG=${{ inputs.release_tag }}" >> "$GITHUB_ENV"

      - name: Extract Docker metadata (for immutable tags)
        if: matrix.push == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # matrix.tags is a newline-separated list of raw tags produced by
          # the check job (e.g. "2.1.0\nlatest" for releases or
          # "edge\nedge-YYYYMMDD-<shortsha>" for automatic builds).
          tags: ${{ matrix.tags }}

      # Index/manifest-descriptor annotations are only valid for a multi-platform
      # push: buildx rejects them on the single-platform `--load` export used by
      # PR test builds ("index annotations not supported for single platform
      # export"). So they are materialised here only when this leg pushes; for
      # test builds the output stays empty and no annotations are passed.
      - name: Compute index annotations (push legs only)
        id: ann
        run: |
          if [ "${{ matrix.push }}" = "true" ]; then
            {
              echo "annotations<<ANNOTATIONS_EOF"
              echo "index:org.opencontainers.image.base.digest=${{ matrix.base_digest }}"
              echo "index:org.opencontainers.image.revision=${{ github.sha }}"
              echo "manifest-descriptor:org.opencontainers.image.base.digest=${{ matrix.base_digest }}"
              echo "manifest-descriptor:org.opencontainers.image.revision=${{ github.sha }}"
              echo "ANNOTATIONS_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ matrix.push == 'true' }}
          load: ${{ matrix.push != 'true' }}
          platforms: ${{ matrix.push == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          tags: ${{ matrix.push == 'true' && steps.meta.outputs.tags || format('ma-ytmusic-test:{0}', matrix.variant) }}
          build-args: |
            MA_VERSION=${{ matrix.ma_version }}
            PLUGIN_REF=${{ matrix.plugin_ref }}
          labels: |
            org.opencontainers.image.base.digest=${{ matrix.base_digest }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Store the annotations on the index and per-platform manifest
          # descriptors so the next scheduled run can read them via
          # `docker buildx imagetools inspect --raw` (push legs only, see the
          # step above).
          annotations: ${{ steps.ann.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
